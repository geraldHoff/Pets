# XcodeGen spec. CI runs `xcodegen generate`; the .xcodeproj is never committed.
name: ScreenPet

options:
  bundleIdPrefix: com.example # TODO: replace with your reverse-DNS prefix before signing
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  PetCore:
    path: PetCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ScreenPet:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screenpet
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screen Pet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme: {}
